name: TradeChest
version: '2.0.0'
main: com.launcher.Main
api-version: '1.21'
authors: [ TradeChest ]
description: Player-owned chest shops for Paper 26.1.2

commands:
  tradechest:
    description: Main command for TradeChest
    usage: /tradechest <create|remove|settings|shops|stats|reload|help>
    aliases: [ ishop, shop ]
    permission: tradechest.use

permissions:
  tradechest.use:
    description: Allows using basic TradeChest commands
    default: true
  tradechest.create:
    description: Allows creating item shops
    default: true
  tradechest.remove:
    description: Allows removing own shops
    default: true
  tradechest.admin:
    description: Admin access — bypass limits, remove any shop, reload config
    default: op
    children:
      tradechest.use: true
      tradechest.create: true
      tradechest.remove: true
      tradechest.bypass.limit: true
  tradechest.bypass.limit:
    description: Bypass per-player shop limit
    default: op
