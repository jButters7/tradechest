# TradeChest Configuration
# Compatible with Paper 26.1.2+

# Plugin prefix shown in chat messages
prefix: "&8[&6TradeChest&8]"

shop:
  # Maximum shops per player (0 = unlimited)
  max-shops-per-player: 5

  # Radius in blocks around a shop chest that is protected from block breaks/places
  protection-radius: 1

  # Maximum quantity a buyer can purchase in a single transaction (0 = unlimited)
  max-purchase-quantity: 64

  # Height (in blocks above the chest) where the hologram title appears
  hologram-height: 2.0

  # How often (in seconds) shops are auto-saved to disk (0 = only on shutdown/reload)
  autosave-interval: 300

  # Notify shop owners in-game when someone makes a purchase
  sale-notifications: true
